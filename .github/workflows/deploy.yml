name: Deploy Angular Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: |
          BASE_HREF="/${GITHUB_REPOSITORY#*/}/"
          npx ng build --configuration production --base-href "$BASE_HREF"

      - name: Prepare deployment
        run: |
          cp dist/realtime-fintech-dashboard/browser/index.html \
             dist/realtime-fintech-dashboard/browser/404.html

          touch dist/realtime-fintech-dashboard/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/realtime-fintech-dashboard/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
