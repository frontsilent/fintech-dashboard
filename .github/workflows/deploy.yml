name: Deploy Angular Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/market-data-generator -> target

      - name: Install dependencies
        run: npm ci

      # Formatting, linters, Rust and Jest tests; a failing check stops the deployment.
      - name: Check
        run: npm run check

      # `npm run build` runs `prebuild`, so the deployed Wasm module is compiled from the Rust sources of this commit.
      - name: Build Angular application
        run: |
          BASE_HREF="/${GITHUB_REPOSITORY#*/}/"
          npm run build -- --configuration production --base-href "$BASE_HREF"

      - name: Prepare deployment
        run: |
          cp dist/realtime-fintech-dashboard/browser/index.html \
             dist/realtime-fintech-dashboard/browser/404.html

          touch dist/realtime-fintech-dashboard/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/realtime-fintech-dashboard/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
